name: Java CI Gateway Educacao

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t alexbuttielie/ms-gateway-educacao:gateway-main -f Dockerfile .
          docker push alexbuttielie/ms-gateway-educacao:gateway-main

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          port: 22022
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull alexbuttielie/ms-gateway-educacao:gateway-main
            docker stop eureka-gateway || true
            docker rm eureka-gateway || true
            docker run -d --name eureka-gateway -p 8082:8082 alexbuttielie/ms-gateway-educacao:gateway-main
