name: Java CI Gateway Educacao

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Set up Docker
        uses: docker/setup-buildx-action@v1

      - name: Build Docker Image
        run: |
          docker build -t alexbuttielie/ms-gateway-educacao:gateway-main -f Dockerfile .
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker push alexbuttielie/ms-gateway-educacao:gateway-main

      - name: Add SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > id_rsa
          chmod 600 id_rsa
          mkdir -p ~/.ssh
          echo -e "Host vps\n  HostName ${{ secrets.VPS_HOST }}\n  User deploy\n  Port 22022\n  IdentityFile $(pwd)/id_rsa\n  StrictHostKeyChecking no" > ~/.ssh/config

      - name: Test SSH Connection
        run: ssh vps "echo ? Conexão SSH funcionando"

      - name: Deploy on VPS
        run: |
          ssh vps << 'EOF'
          docker pull alexbuttielie/ms-gateway-educacao:gateway-main
          docker stop eureka-gateway || true
          docker rm eureka-gateway || true
          docker run -d --name eureka-gateway -p 8081:8081 alexbuttielie/ms-gateway-educacao:gateway-main
          EOF

